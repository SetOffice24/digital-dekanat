# Виртуальный хост для nginx на сервере. Подставить пути к сертификату, которые уже используются для service.setoffice.ru.
# ВАЖНО: никаких root/try_files на папку проекта — код и deploy/.env не должны раздаваться как статика.
# Проверка: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name service.setoffice.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name service.setoffice.ru;

    # ssl_certificate     /etc/letsencrypt/live/service.setoffice.ru/fullchain.pem;   # ← как сейчас настроено
    # ssl_certificate_key /etc/letsencrypt/live/service.setoffice.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # как proxyClientMaxBodySize в next.config.ts: сдача ДЗ — до 25 МБ за запрос
    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        # Host и Origin должны совпадать с адресом сайта — на этом построена защита запросов (CSRF) в приложении
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # реальный адрес клиента — последним в цепочке (по нему считаются лимиты входа)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # помощник отвечает до 30 с, разбор PDF/Word — до 20 с
        proxy_read_timeout 90s;
    }
}
