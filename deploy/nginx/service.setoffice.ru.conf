# service.setoffice.ru — «Цифровой деканат» за nginx VPS. Заменяет /etc/nginx/conf.d/service.setoffice.ru.conf.
#
# Архитектура Jino (проверено 22.11.2026, как у соседних сайтов на этом же сервере):
#   браузер ──https──► прокси хостера Jino (81.177.6.131): TLS, сертификат — у хостера
#                         └──plain http──► nginx VPS :80 (этот файл) ──► 127.0.0.1:3210 (контейнер приложения)
#   • listen 443 / ssl_* здесь НЕТ и не нужно.
#   • Адрес посетителя — в X-Forwarded-For; доверяем только прокси Jino (realip).
#   • Редирект http→https — только по X-Forwarded-Proto: http от прокси (безусловный дал бы петлю).
#   • Файлы с диска НЕ раздаются: всё уходит в приложение (иначе код и deploy/.env были бы доступны по ссылке).
# Применение: cp … /etc/nginx/conf.d/service.setoffice.ru.conf && nginx -t && systemctl reload nginx

map $http_x_forwarded_proto $univer_need_https {
    default 0;
    http    1;
}

server {
    listen 80;
    server_name service.setoffice.ru;

    set_real_ip_from 81.177.6.131;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    if ($univer_need_https) {
        return 301 https://service.setoffice.ru$request_uri;
    }

    # как proxyClientMaxBodySize в next.config.ts: сдача ДЗ — до 25 МБ за запрос
    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        # Host должен совпадать с адресом сайта — на нём построена проверка Origin (защита от CSRF) в приложении
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # после realip $remote_addr = посетитель; приложение берёт последний адрес цепочки — передаём ровно его
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # помощник отвечает до 30 с, разбор PDF/Word — до 20 с
        proxy_read_timeout 90s;
    }
}
