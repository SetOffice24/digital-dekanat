# Продакшен на VPS: cd <папка проекта>/deploy && docker compose up -d --build
# Схема по умолчанию: на сервере уже есть nginx (80/443, HTTPS) — приложение слушает только 127.0.0.1:APP_PORT,
# nginx проксирует на него (deploy/nginx/service.setoffice.ru.conf). БД наружу не открыта.
# Свой Caddy с HTTPS — только если на сервере нет веб-сервера: docker compose --profile caddy up -d (нужен SITE_HOST).
name: univer

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: univer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      POSTGRES_DB: univer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U univer"]
      interval: 5s
      retries: 10

  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://univer:${DB_PASSWORD}@db:5432/univer
      NODE_ENV: production
      DATA_DIR: /app/data
    # только локальный интерфейс: снаружи сайт доступен лишь через nginx
    ports:
      - "127.0.0.1:${APP_PORT:-3210}:3000"
    volumes:
      - uploads:/app/data
      # сертификат НУЦ Минцифры для GigaChat (docs/GIGACHAT.md); только чтение
      - ./certs:/app/certs:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
